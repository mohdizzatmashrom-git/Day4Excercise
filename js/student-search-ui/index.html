<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Search</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .search-bar {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        #search-input {
            padding: 8px;
            width: 250px;
            font-size: 14px;
        }
        button {
            padding: 8px 16px;
            cursor: pointer;
        }
        .student-card {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            width: 300px;
        }
        .no-results {
            color: gray;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>Student List</h1>

    <div class="search-bar">
        <input type="text" id="search-input" placeholder="Search by student name..." />
        <button id="search-button">Search</button>
        <button id="reset-button">Reset</button>
    </div>

    <div id="student-list"></div>

    <script src="script.js"></script>
</body>
</html>
